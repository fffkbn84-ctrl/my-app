<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 390" width="520" height="390" role="img" aria-label="くし葉 横浜ワールドポーターズ 揚げ鍋つきテーブル席と窓側カウンター席の配置図。番号は本文の説明に対応する">
  <title>くし葉 横浜ワールドポーターズ 揚げ鍋つきテーブル席の配置</title>
  <defs>
    <style>
      .mk { font-family: "Hiragino Sans", "Noto Sans JP", sans-serif; font-size: 15px; font-weight: 600; fill: #FFFFFF; }
      .cap { font-family: "Hiragino Sans", "Noto Sans JP", sans-serif; font-size: 14px; fill: #8A7A6E; }
    </style>
  </defs>

  <rect width="520" height="390" fill="#F5EEE6"/>

  <!-- 窓（上側・外にみなとみらい） -->
  <line x1="30" y1="36" x2="490" y2="36" stroke="#B0937A" stroke-width="4"/>
  <line x1="60" y1="36" x2="460" y2="36" stroke="#F5EEE6" stroke-width="2" stroke-dasharray="52 10"/>
  <text class="cap" x="30" y="24">窓・外にみなとみらい</text>

  <!-- 窓向きのカウンターと横並びのいす -->
  <rect x="40" y="44" width="440" height="22" rx="4" fill="#EADFD2" stroke="#C9B7A8" stroke-width="1"/>
  <g fill="none" stroke="#C9B7A8" stroke-width="1" stroke-dasharray="4 4">
    <rect x="60" y="72" width="26" height="20" rx="5"/><rect x="100" y="72" width="26" height="20" rx="5"/>
    <rect x="160" y="72" width="26" height="20" rx="5"/><rect x="200" y="72" width="26" height="20" rx="5"/>
    <rect x="260" y="72" width="26" height="20" rx="5"/><rect x="300" y="72" width="26" height="20" rx="5"/>
    <rect x="360" y="72" width="26" height="20" rx="5"/><rect x="400" y="72" width="26" height="20" rx="5"/>
  </g>
  <g stroke="#B0937A" stroke-width="2">
    <line x1="143" y1="46" x2="143" y2="64"/><line x1="243" y1="46" x2="243" y2="64"/><line x1="343" y1="46" x2="343" y2="64"/>
  </g>

  <!-- 通路 -->
  <text class="cap" x="232" y="130">通路</text>

  <!-- テーブル席の列（腰の高さの仕切りで区切られている） -->
  <g stroke="#B0937A" stroke-width="3">
    <line x1="168" y1="170" x2="168" y2="330"/><line x1="352" y1="170" x2="352" y2="330"/>
  </g>
  <g fill="none" stroke="#C9B7A8" stroke-width="1" stroke-dasharray="4 4">
    <rect x="60" y="210" width="90" height="80" rx="8"/>
    <rect x="370" y="210" width="90" height="80" rx="8"/>
  </g>

  <!-- 座った席：真ん中に揚げ鍋がある4人がけ -->
  <rect x="200" y="210" width="120" height="80" rx="8" fill="#EFE2D3" stroke="#D4A090" stroke-width="1.5"/>
  <circle cx="260" cy="250" r="14" fill="#EADFD2" stroke="#B0937A" stroke-width="1.5"/>
  <rect x="214" y="184" width="32" height="22" rx="5" fill="#EADFD2" stroke="#C9B7A8" stroke-width="1"/>
  <rect x="274" y="184" width="32" height="22" rx="5" fill="#EADFD2" stroke="#C9B7A8" stroke-width="1"/>
  <rect x="214" y="294" width="32" height="22" rx="5" fill="#EADFD2" stroke="#C9B7A8" stroke-width="1"/>
  <rect x="274" y="294" width="32" height="22" rx="5" fill="#EADFD2" stroke="#C9B7A8" stroke-width="1"/>
  <text class="cap" x="232" y="352">揚げ鍋</text>
  <line x1="260" y1="338" x2="260" y2="266" stroke="#C9B7A8" stroke-width="1"/>

  <!-- 本文の番号付きリストと対応する -->
  <g>
    <circle cx="230" cy="250" r="13" fill="#B07E6C"/><text class="mk" x="230" y="255" text-anchor="middle">1</text>
    <circle cx="352" cy="250" r="13" fill="#B07E6C"/><text class="mk" x="352" y="255" text-anchor="middle">2</text>
    <circle cx="213" cy="82" r="13" fill="#B07E6C"/><text class="mk" x="213" y="87" text-anchor="middle">3</text>
  </g>
</svg>
