<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 460" width="480" height="460" role="img" aria-label="銀座伴助 新宿タカシマヤ タイムズスクエア店 窓向き横並び席の配置図。番号は本文の説明に対応する">
  <title>銀座伴助 新宿タカシマヤ タイムズスクエア店 窓向き横並び席の配置</title>
  <defs>
    <style>
      .mk { font-family: "Hiragino Sans", "Noto Sans JP", sans-serif; font-size: 15px; font-weight: 600; fill: #FFFFFF; }
      .cap { font-family: "Hiragino Sans", "Noto Sans JP", sans-serif; font-size: 14px; fill: #8A7A6E; }
    </style>
  </defs>

  <rect width="480" height="460" fill="#F5EEE6"/>

  <!-- 窓の外（14階からの景色） -->
  <text class="cap" x="240" y="40" text-anchor="middle">外の景色（14階）</text>

  <!-- 窓 -->
  <line x1="96" y1="64" x2="384" y2="64" stroke="#A8BCC4" stroke-width="4"/>
  <line x1="96" y1="70" x2="384" y2="70" stroke="#A8BCC4" stroke-width="1.5"/>

  <!-- 席まわりの床 -->
  <rect x="96" y="70" width="288" height="248" fill="#FBF6F0" stroke="#DCCBBC" stroke-width="1"/>

  <!-- 左右のしきり -->
  <line x1="96" y1="70" x2="96" y2="318" stroke="#B0937A" stroke-width="3"/>
  <line x1="384" y1="70" x2="384" y2="318" stroke="#B0937A" stroke-width="3"/>

  <!-- 隣の席（しきりの向こう） -->
  <rect x="24" y="120" width="50" height="150" rx="6" fill="none" stroke="#C9B7A8" stroke-width="1" stroke-dasharray="4 4"/>
  <rect x="406" y="120" width="50" height="150" rx="6" fill="none" stroke="#C9B7A8" stroke-width="1" stroke-dasharray="4 4"/>
  <text class="cap" x="49" y="288" text-anchor="middle">隣席</text>
  <text class="cap" x="431" y="288" text-anchor="middle">隣席</text>

  <!-- テーブル（窓に沿った横長） -->
  <rect x="116" y="92" width="248" height="76" rx="4" fill="#EFE2D3" stroke="#D4A090" stroke-width="1.5"/>

  <!-- 着席位置（窓を向いて横並び。右が撮影者） -->
  <circle cx="196" cy="212" r="16" fill="none" stroke="#D4A090" stroke-width="1.5"/>
  <circle cx="284" cy="212" r="16" fill="#D4A090"/>

  <!-- 視線が窓へ抜ける -->
  <path d="M196 194 V176" stroke="#C9B7A8" stroke-width="1" stroke-dasharray="3 3"/>
  <path d="M284 194 V176" stroke="#C9B7A8" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- 通路（背中側） -->
  <line x1="96" y1="318" x2="384" y2="318" stroke="#C9B7A8" stroke-width="1" stroke-dasharray="6 5"/>
  <path d="M240 330 v30" stroke="#B9A697" stroke-width="1" fill="none"/>
  <path d="M232 352 l8 10 l8 -10" fill="none" stroke="#B9A697" stroke-width="1"/>
  <text class="cap" x="240" y="404" text-anchor="middle">通路・入口</text>

  <!-- 本文の番号付きリストと対応する -->
  <g>
    <circle cx="140" cy="67" r="13" fill="#B07E6C"/><text class="mk" x="140" y="72" text-anchor="middle">1</text>
    <circle cx="240" cy="252" r="13" fill="#B07E6C"/><text class="mk" x="240" y="257" text-anchor="middle">2</text>
    <circle cx="96" cy="194" r="13" fill="#B07E6C"/><text class="mk" x="96" y="199" text-anchor="middle">3</text>
    <circle cx="340" cy="130" r="13" fill="#B07E6C"/><text class="mk" x="340" y="135" text-anchor="middle">4</text>
    <circle cx="196" cy="332" r="13" fill="#B07E6C"/><text class="mk" x="196" y="337" text-anchor="middle">5</text>
  </g>
</svg>
