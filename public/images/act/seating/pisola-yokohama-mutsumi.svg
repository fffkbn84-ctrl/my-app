<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 460" width="480" height="460" role="img" aria-label="PISOLA 横浜睦町店 半個室ボックス席の配置図。番号は本文の説明に対応する">
  <title>PISOLA 横浜睦町店 半個室ボックス席の配置</title>
  <defs>
    <pattern id="sudare" width="5" height="5" patternUnits="userSpaceOnUse">
      <path d="M0 0 V5" stroke="#C6A98F" stroke-width="1"/>
    </pattern>
    <style>
      .mk { font-family: "Hiragino Sans", "Noto Sans JP", sans-serif; font-size: 15px; font-weight: 600; fill: #FFFFFF; }
      .cap { font-family: "Hiragino Sans", "Noto Sans JP", sans-serif; font-size: 14px; fill: #8A7A6E; }
    </style>
  </defs>

  <rect width="480" height="460" fill="#F5EEE6"/>

  <!-- すだれの向こうの隣テーブル -->
  <rect x="150" y="24" width="180" height="30" rx="6" fill="none" stroke="#C9B7A8" stroke-width="1" stroke-dasharray="4 4"/>
  <text class="cap" x="240" y="44" text-anchor="middle">隣のテーブル</text>

  <!-- すだれの間仕切り -->
  <rect x="86" y="70" width="308" height="14" fill="url(#sudare)" stroke="#B0937A" stroke-width="1"/>

  <!-- ブースの床 -->
  <rect x="86" y="84" width="308" height="262" fill="#FBF6F0" stroke="#DCCBBC" stroke-width="1"/>

  <!-- 背もたれ側の仕切り -->
  <line x1="86" y1="84" x2="86" y2="346" stroke="#B0937A" stroke-width="3"/>
  <line x1="394" y1="84" x2="394" y2="346" stroke="#B0937A" stroke-width="3"/>

  <!-- ベンチソファ -->
  <rect x="98" y="102" width="68" height="226" rx="8" fill="#EADFD2" stroke="#C9B7A8" stroke-width="1"/>
  <rect x="314" y="102" width="68" height="226" rx="8" fill="#EADFD2" stroke="#C9B7A8" stroke-width="1"/>

  <!-- テーブル -->
  <polygon points="192,110 288,110 288,254 264,300 216,300 192,254"
           fill="#EFE2D3" stroke="#D4A090" stroke-width="1.5"/>

  <!-- 着席位置 -->
  <circle cx="132" cy="214" r="15" fill="#D4A090"/>
  <circle cx="348" cy="214" r="15" fill="none" stroke="#D4A090" stroke-width="1.5"/>

  <!-- 対面距離 -->
  <line x1="192" y1="322" x2="288" y2="322" stroke="#B9A697" stroke-width="1"/>
  <line x1="192" y1="317" x2="192" y2="327" stroke="#B9A697" stroke-width="1"/>
  <line x1="288" y1="317" x2="288" y2="327" stroke="#B9A697" stroke-width="1"/>
  <text class="cap" x="240" y="315" text-anchor="middle">約0.5m</text>

  <!-- 通路側の布カーテン（両脇に束ねてある。破線は閉めた位置） -->
  <path d="M94 330 q8 8 0 16 q-8 8 0 16 q8 8 0 12" fill="none" stroke="#A9A29C" stroke-width="2.5"/>
  <path d="M386 330 q-8 8 0 16 q8 8 0 16 q-8 8 0 12" fill="none" stroke="#A9A29C" stroke-width="2.5"/>
  <path d="M106 346 q22 -6 44 0 q22 6 44 0 q22 -6 44 0 q22 6 44 0 q22 -6 44 0 q22 6 44 0"
        fill="none" stroke="#A9A29C" stroke-width="1.5" stroke-dasharray="5 5"/>

  <!-- 通路 -->
  <path d="M240 360 v30" stroke="#B9A697" stroke-width="1" fill="none"/>
  <path d="M232 382 l8 10 l8 -10" fill="none" stroke="#B9A697" stroke-width="1"/>
  <text class="cap" x="240" y="428" text-anchor="middle">通路</text>

  <!-- 本文の番号付きリストと対応する -->
  <g>
    <circle cx="200" cy="370" r="13" fill="#B07E6C"/><text class="mk" x="200" y="375" text-anchor="middle">1</text>
    <circle cx="106" cy="358" r="13" fill="#B07E6C"/><text class="mk" x="106" y="363" text-anchor="middle">2</text>
    <circle cx="166" cy="120" r="13" fill="#B07E6C"/><text class="mk" x="166" y="125" text-anchor="middle">3</text>
    <circle cx="240" cy="92" r="13" fill="#B07E6C"/><text class="mk" x="240" y="97" text-anchor="middle">4</text>
    <circle cx="72" cy="214" r="13" fill="#B07E6C"/><text class="mk" x="72" y="219" text-anchor="middle">5</text>
  </g>
</svg>
