<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 390" width="520" height="390" role="img" aria-label="明神下 神田川 本店 和室の個室の配置図。番号は本文の説明に対応する">
  <title>明神下 神田川 本店 和室の個室の配置</title>
  <defs>
    <style>
      .mk { font-family: "Hiragino Sans", "Noto Sans JP", sans-serif; font-size: 15px; font-weight: 600; fill: #FFFFFF; }
      .cap { font-family: "Hiragino Sans", "Noto Sans JP", sans-serif; font-size: 14px; fill: #8A7A6E; }
    </style>
  </defs>

  <rect width="520" height="390" fill="#F5EEE6"/>

  <!-- 部屋の壁 -->
  <rect x="40" y="40" width="440" height="320" fill="none" stroke="#B0937A" stroke-width="4"/>

  <!-- 畳の目地 -->
  <line x1="40" y1="200" x2="480" y2="200" stroke="#E2D5C6" stroke-width="1"/>
  <line x1="260" y1="40" x2="260" y2="360" stroke="#E2D5C6" stroke-width="1"/>

  <!-- 奥の壁：掛け軸などの飾り（部屋によって違う） -->
  <rect x="200" y="44" width="120" height="10" rx="2" fill="#EADFD2" stroke="#C9B7A8" stroke-width="1"/>
  <text class="cap" x="190" y="30">掛け軸などの飾り</text>

  <!-- 窓（左側） -->
  <line x1="40" y1="90" x2="40" y2="250" stroke="#F5EEE6" stroke-width="2" stroke-dasharray="36 8"/>

  <!-- 座った席：木のテーブルといす（畳の上） -->
  <rect x="196" y="160" width="128" height="84" rx="6" fill="#EFE2D3" stroke="#D4A090" stroke-width="1.5"/>
  <rect x="214" y="134" width="32" height="22" rx="5" fill="#EADFD2" stroke="#C9B7A8" stroke-width="1"/>
  <rect x="274" y="134" width="32" height="22" rx="5" fill="#EADFD2" stroke="#C9B7A8" stroke-width="1"/>
  <rect x="214" y="248" width="32" height="22" rx="5" fill="#EADFD2" stroke="#C9B7A8" stroke-width="1"/>
  <rect x="274" y="248" width="32" height="22" rx="5" fill="#EADFD2" stroke="#C9B7A8" stroke-width="1"/>

  <!-- 本文の番号付きリストと対応する -->
  <g>
    <circle cx="260" cy="202" r="13" fill="#B07E6C"/><text class="mk" x="260" y="207" text-anchor="middle">1</text>
    <circle cx="260" cy="76" r="13" fill="#B07E6C"/><text class="mk" x="260" y="81" text-anchor="middle">2</text>
    <circle cx="40" cy="170" r="13" fill="#B07E6C"/><text class="mk" x="40" y="175" text-anchor="middle">3</text>
  </g>
</svg>
