<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 390" width="520" height="390" role="img" aria-label="フィオレンティーナ 中央の4人がけテーブルの配置図。番号は本文の説明に対応する">
  <title>フィオレンティーナ 中央の4人がけテーブルの配置</title>
  <defs>
    <style>
      .mk { font-family: "Hiragino Sans", "Noto Sans JP", sans-serif; font-size: 15px; font-weight: 600; fill: #FFFFFF; }
      .cap { font-family: "Hiragino Sans", "Noto Sans JP", sans-serif; font-size: 14px; fill: #8A7A6E; }
    </style>
  </defs>

  <rect width="520" height="390" fill="#F5EEE6"/>

  <!-- 窓（左側・外に庭とテラス） -->
  <line x1="36" y1="30" x2="36" y2="360" stroke="#B0937A" stroke-width="4"/>
  <line x1="36" y1="60" x2="36" y2="330" stroke="#F5EEE6" stroke-width="2" stroke-dasharray="46 10"/>
  <text class="cap" x="58" y="24">窓・外に庭とテラス</text>

  <!-- 窓際の席 -->
  <rect x="56" y="70" width="70" height="56" rx="8" fill="none" stroke="#C9B7A8" stroke-width="1" stroke-dasharray="4 4"/>
  <rect x="56" y="264" width="70" height="56" rx="8" fill="none" stroke="#C9B7A8" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- 壁沿いのベンチソファ（右側）と2人がけの席 -->
  <line x1="484" y1="30" x2="484" y2="360" stroke="#B0937A" stroke-width="4"/>
  <rect x="444" y="40" width="34" height="310" rx="8" fill="#EADFD2" stroke="#C9B7A8" stroke-width="1"/>
  <rect x="372" y="62" width="60" height="56" rx="8" fill="none" stroke="#C9B7A8" stroke-width="1" stroke-dasharray="4 4"/>
  <rect x="372" y="167" width="60" height="56" rx="8" fill="none" stroke="#C9B7A8" stroke-width="1" stroke-dasharray="4 4"/>
  <rect x="372" y="272" width="60" height="56" rx="8" fill="none" stroke="#C9B7A8" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- 中央の隣のテーブル -->
  <rect x="200" y="48" width="88" height="70" rx="8" fill="none" stroke="#C9B7A8" stroke-width="1" stroke-dasharray="4 4"/>
  <rect x="200" y="272" width="88" height="70" rx="8" fill="none" stroke="#C9B7A8" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- 座った席：中央の4人がけ -->
  <rect x="192" y="150" width="104" height="90" rx="8" fill="#EFE2D3" stroke="#D4A090" stroke-width="1.5"/>
  <rect x="206" y="126" width="30" height="20" rx="5" fill="#EADFD2" stroke="#C9B7A8" stroke-width="1"/>
  <rect x="252" y="126" width="30" height="20" rx="5" fill="#EADFD2" stroke="#C9B7A8" stroke-width="1"/>
  <rect x="206" y="244" width="30" height="20" rx="5" fill="#EADFD2" stroke="#C9B7A8" stroke-width="1"/>
  <rect x="252" y="244" width="30" height="20" rx="5" fill="#EADFD2" stroke="#C9B7A8" stroke-width="1"/>
  <circle cx="221" cy="136" r="15" fill="none" stroke="#D4A090" stroke-width="1.5"/>
  <circle cx="221" cy="254" r="15" fill="none" stroke="#D4A090" stroke-width="1.5"/>

  <!-- 本文の番号付きリストと対応する -->
  <g>
    <circle cx="244" cy="195" r="13" fill="#B07E6C"/><text class="mk" x="244" y="200" text-anchor="middle">1</text>
    <circle cx="36" cy="195" r="13" fill="#B07E6C"/><text class="mk" x="36" y="200" text-anchor="middle">2</text>
    <circle cx="461" cy="195" r="13" fill="#B07E6C"/><text class="mk" x="461" y="200" text-anchor="middle">3</text>
    <circle cx="244" cy="83" r="13" fill="#B07E6C"/><text class="mk" x="244" y="88" text-anchor="middle">4</text>
  </g>
</svg>
