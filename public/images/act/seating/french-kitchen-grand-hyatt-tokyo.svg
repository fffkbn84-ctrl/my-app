<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 390" width="520" height="390" role="img" aria-label="フレンチ キッチン 通路の奥の6人がけテーブルの配置図。番号は本文の説明に対応する">
  <title>フレンチ キッチン 通路の奥の6人がけテーブルの配置</title>
  <defs>
    <style>
      .mk { font-family: "Hiragino Sans", "Noto Sans JP", sans-serif; font-size: 15px; font-weight: 600; fill: #FFFFFF; }
      .cap { font-family: "Hiragino Sans", "Noto Sans JP", sans-serif; font-size: 14px; fill: #8A7A6E; }
    </style>
  </defs>

  <rect width="520" height="390" fill="#F5EEE6"/>

  <!-- 奥の窓・テラス -->
  <line x1="36" y1="22" x2="484" y2="22" stroke="#B0937A" stroke-width="4"/>
  <line x1="60" y1="22" x2="460" y2="22" stroke="#F5EEE6" stroke-width="2" stroke-dasharray="46 10"/>
  <text class="cap" x="260" y="16" text-anchor="middle">窓・外にテラス</text>

  <!-- 料理が並ぶところ（通路の突き当たり） -->
  <rect x="210" y="36" width="100" height="40" rx="8" fill="#EADFD2" stroke="#C9B7A8" stroke-width="1"/>
  <text class="cap" x="260" y="61" text-anchor="middle">料理</text>

  <!-- 中央の通路（両側にガラスの仕切り） -->
  <line x1="236" y1="96" x2="236" y2="352" stroke="#C9B7A8" stroke-width="2"/>
  <line x1="284" y1="96" x2="284" y2="352" stroke="#C9B7A8" stroke-width="2"/>
  <text class="cap" x="260" y="376" text-anchor="middle">入口</text>

  <!-- 座った席：通路の奥の6人がけ -->
  <rect x="94" y="96" width="120" height="66" rx="8" fill="#EFE2D3" stroke="#D4A090" stroke-width="1.5"/>
  <circle cx="124" cy="96" r="14" fill="none" stroke="#D4A090" stroke-width="1.5"/>
  <circle cx="124" cy="162" r="14" fill="none" stroke="#D4A090" stroke-width="1.5"/>

  <!-- 真後ろの席（少し近い） -->
  <rect x="94" y="184" width="120" height="52" rx="8" fill="none" stroke="#C9B7A8" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- 左側のほかの席 -->
  <rect x="94" y="276" width="120" height="52" rx="8" fill="none" stroke="#C9B7A8" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- 右側：背の高い仕切りのボックス席 -->
  <rect x="306" y="120" width="120" height="60" rx="8" fill="none" stroke="#C9B7A8" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="306" y1="196" x2="470" y2="196" stroke="#B0937A" stroke-width="3"/>
  <rect x="306" y="212" width="120" height="60" rx="8" fill="none" stroke="#C9B7A8" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="306" y1="288" x2="470" y2="288" stroke="#B0937A" stroke-width="3"/>

  <!-- 本文の番号付きリストと対応する -->
  <g>
    <circle cx="260" cy="230" r="13" fill="#B07E6C"/><text class="mk" x="260" y="235" text-anchor="middle">1</text>
    <circle cx="448" cy="242" r="13" fill="#B07E6C"/><text class="mk" x="448" y="247" text-anchor="middle">2</text>
    <circle cx="330" cy="56" r="13" fill="#B07E6C"/><text class="mk" x="330" y="61" text-anchor="middle">3</text>
    <circle cx="178" cy="129" r="13" fill="#B07E6C"/><text class="mk" x="178" y="134" text-anchor="middle">4</text>
    <circle cx="154" cy="210" r="13" fill="#B07E6C"/><text class="mk" x="154" y="215" text-anchor="middle">5</text>
  </g>
</svg>
